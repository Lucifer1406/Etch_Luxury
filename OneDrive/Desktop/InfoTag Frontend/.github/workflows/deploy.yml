name: Deploy INFOTAG Flutter Web to GitHub Pages

on:
  push:
    branches:
      - Mark_03
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install dependencies
        working-directory: "OneDrive/Desktop/InfoTag Frontend"
        run: flutter pub get

      - name: Build Flutter web
        working-directory: "OneDrive/Desktop/InfoTag Frontend"
        run: flutter build web --release --base-href "/Etch_Luxury/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "OneDrive/Desktop/InfoTag Frontend/build/web"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
